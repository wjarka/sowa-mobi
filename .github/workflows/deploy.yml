name: Test and publish

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

# Serialize publication for each ref.
concurrency:
  group: sowa-mobi-${{ github.ref }}
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: astral-sh/setup-uv@d0d8abe699bfb85fec6de9f7adb5ae17292296ff # v6
        with:
          version: "0.12.20"
          python-version: "3.11"
      - run: uv sync --locked
      - run: uv run --no-sync python -m unittest discover -v

  image:
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write
      statuses: write
    outputs:
      digest: ${{ steps.publish.outputs.digest }}
      image: ${{ steps.image-name.outputs.image }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Resolve image repository
        id: image-name
        run: echo "image=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          load: true
          tags: sowa-mobi:smoke
          build-args: SOWA_REVISION=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/master'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish tested image
        id: publish
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/master'
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          push: true
          tags: ${{ steps.image-name.outputs.image }}:sha-${{ github.sha }}
          build-args: SOWA_REVISION=${{ github.sha }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke-test the container with example configuration
        env:
          REVISION: ${{ github.sha }}
          SMOKE_IMAGE: ${{ steps.publish.outputs.digest && format('{0}@{1}', steps.image-name.outputs.image, steps.publish.outputs.digest) || 'sowa-mobi:smoke' }}
        run: |
          set -euo pipefail
          docker run -d --name sowa-smoke -p 127.0.0.1:8000:8000 \
            -v "$PWD/config/sowa.example.json:/config/sowa.json:ro" "$SMOKE_IMAGE"
          trap 'docker logs sowa-smoke; docker rm -f sowa-smoke' EXIT
          for attempt in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8000/healthz | \
              jq -e --arg revision "$REVISION" '.status == "ok" and .revision == $revision'; then
              exit 0
            fi
            sleep 2
          done
          echo 'Container did not become healthy with the expected revision' >&2
          exit 1

      - name: Record the tested image digest
        if: github.event_name != 'pull_request' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
        env:
          GH_TOKEN: ${{ github.token }}
          DIGEST: ${{ steps.publish.outputs.digest }}
        run: |
          set -euo pipefail
          [[ "$DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]]
          gh api --method POST "repos/$GITHUB_REPOSITORY/statuses/$GITHUB_SHA" \
            -f state=success -f context=container-image \
            -f description="$DIGEST" \
            -f target_url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/attempts/$GITHUB_RUN_ATTEMPT"
