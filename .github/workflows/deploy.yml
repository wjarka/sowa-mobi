name: Test, publish and deploy

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

# Never interrupt a promotion or let an older run overwrite a newer release.
concurrency:
  group: sowa-mobi-${{ github.ref }}
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: astral-sh/setup-uv@d0d8abe699bfb85fec6de9f7adb5ae17292296ff # v6
        with:
          version: "0.12.20"
          python-version: "3.11"
      - run: uv sync --locked
      - run: uv run --no-sync python -m unittest discover -v

  image:
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write
    outputs:
      digest: ${{ steps.publish.outputs.digest }}
      image: ${{ steps.image-name.outputs.image }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Resolve image repository
        id: image-name
        run: echo "image=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          load: true
          tags: sowa-mobi:smoke
          build-args: SOWA_REVISION=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/master'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish tested image
        id: publish
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/master'
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          push: true
          tags: ${{ steps.image-name.outputs.image }}:sha-${{ github.sha }}
          build-args: SOWA_REVISION=${{ github.sha }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke-test the container with example configuration
        env:
          REVISION: ${{ github.sha }}
          SMOKE_IMAGE: ${{ steps.publish.outputs.digest && format('{0}@{1}', steps.image-name.outputs.image, steps.publish.outputs.digest) || 'sowa-mobi:smoke' }}
        run: |
          set -euo pipefail
          docker run -d --name sowa-smoke -p 127.0.0.1:8000:8000 \
            -v "$PWD/config/sowa.example.json:/config/sowa.json:ro" "$SMOKE_IMAGE"
          trap 'docker logs sowa-smoke; docker rm -f sowa-smoke' EXIT
          for attempt in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8000/healthz | \
              jq -e --arg revision "$REVISION" '.status == "ok" and .revision == $revision'; then
              exit 0
            fi
            sleep 2
          done
          echo 'Container did not become healthy with the expected revision' >&2
          exit 1

  deploy:
    needs: image
    if: vars.DEPLOY_ENABLED == 'true' && github.event_name != 'pull_request' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      DEPLOY_BRANCH: ${{ vars.DEPLOY_BRANCH || 'main' }}
      DEPLOY_COMPOSE_PATH: ${{ vars.DEPLOY_COMPOSE_PATH || 'stacks/sowa-mobi/compose.yaml' }}
      DEPLOY_RECEIPT_BRANCH: ${{ vars.DEPLOY_RECEIPT_BRANCH || 'deployment-status/sowa-mobi' }}
      IMAGE_REPOSITORY: ${{ needs.image.outputs.image }}
      SOURCE_REPOSITORY: ${{ github.repository }}
      SOURCE_BRANCH: ${{ github.event.repository.default_branch }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@d0d8abe699bfb85fec6de9f7adb5ae17292296ff # v6
        with:
          version: "0.12.20"
          python-version: "3.11"
      - name: Check deployment credentials
        env:
          DEPLOY_KEY: ${{ secrets.DEPLOY_KEY || secrets.HOMELAB_DEPLOY_KEY }}
          DEPLOY_REPOSITORY: ${{ secrets.DEPLOY_REPOSITORY }}
        run: |
          test -n "$DEPLOY_KEY" || { echo 'Set DEPLOY_KEY (or legacy HOMELAB_DEPLOY_KEY)'; exit 1; }
          test -n "$DEPLOY_REPOSITORY" || { echo 'Set DEPLOY_REPOSITORY'; exit 1; }
          git check-ref-format --branch "$DEPLOY_BRANCH"
          git check-ref-format --branch "$DEPLOY_RECEIPT_BRANCH"
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: ${{ secrets.DEPLOY_REPOSITORY }}
          ref: ${{ env.DEPLOY_BRANCH }}
          path: homelab
          ssh-key: ${{ secrets.DEPLOY_KEY || secrets.HOMELAB_DEPLOY_KEY }}
      - name: Commit the image digest to homelab
        id: promote
        env:
          GH_TOKEN: ${{ github.token }}
          REVISION: ${{ github.sha }}
          DIGEST: ${{ needs.image.outputs.digest }}
        run: |
          set -euo pipefail
          git -C homelab config user.name 'sowa-mobi deploy'
          git -C homelab config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          for attempt in $(seq 1 5); do
            head=$(gh api "repos/$SOURCE_REPOSITORY/git/ref/heads/$SOURCE_BRANCH" --jq '.object.sha')
            if [ "$head" != "$REVISION" ]; then
              echo 'Superseded by a newer master commit; skipping promotion.'
              echo 'deployed=false' >> "$GITHUB_OUTPUT"
              exit 0
            fi
            git -C homelab fetch origin "$DEPLOY_BRANCH"
            git -C homelab reset --hard "origin/$DEPLOY_BRANCH"
            uv run --no-project python scripts/update_homelab.py homelab "$DIGEST" "$REVISION"
            git -C homelab add -- "$DEPLOY_COMPOSE_PATH"
            if git -C homelab diff --cached --quiet; then
              echo 'Desired image is already recorded; verifying the running revision.'
              echo 'deployed=true' >> "$GITHUB_OUTPUT"
              exit 0
            fi
            git -C homelab commit -m "deploy: sowa-mobi ${REVISION:0:12}"
            if git -C homelab push origin "HEAD:$DEPLOY_BRANCH"; then
              echo 'deployed=true' >> "$GITHUB_OUTPUT"
              exit 0
            fi
            sleep 5
          done
          echo 'Could not update homelab after five attempts' >&2
          exit 1
      - name: Verify the deployed revision is healthy
        if: steps.promote.outputs.deployed == 'true'
        env:
          REVISION: ${{ github.sha }}
          DIGEST: ${{ needs.image.outputs.digest }}
        run: uv run --no-project python scripts/verify_deployment.py homelab "$REVISION" "$DIGEST"
