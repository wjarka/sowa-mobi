name: Test, publish and deploy

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

# Never interrupt a promotion or let an older run overwrite a newer release.
concurrency:
  group: sowa-mobi-${{ github.ref }}
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: astral-sh/setup-uv@d0d8abe699bfb85fec6de9f7adb5ae17292296ff # v6
        with:
          version: "0.12.20"
          python-version: "3.11"
      - run: uv sync --locked
      - run: uv run --no-sync python -m unittest discover -v

  image:
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write
    outputs:
      digest: ${{ steps.publish.outputs.digest }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          load: true
          tags: sowa-mobi:smoke
          build-args: SOWA_REVISION=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Smoke-test the container with example configuration
        env:
          REVISION: ${{ github.sha }}
        run: |
          set -euo pipefail
          docker run -d --name sowa-smoke -p 127.0.0.1:8000:8000 \
            -v "$PWD/config/sowa.example.json:/config/sowa.json:ro" sowa-mobi:smoke
          trap 'docker logs sowa-smoke; docker rm -f sowa-smoke' EXIT
          for attempt in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8000/healthz | \
              jq -e --arg revision "$REVISION" '.status == "ok" and .revision == $revision'; then
              exit 0
            fi
            sleep 2
          done
          echo 'Container did not become healthy with the expected revision' >&2
          exit 1
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/master'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish tested image
        id: publish
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/master'
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          push: true
          tags: ghcr.io/wjarka/sowa-mobi:sha-${{ github.sha }}
          build-args: SOWA_REVISION=${{ github.sha }}
          labels: |
            org.opencontainers.image.source=https://github.com/wjarka/sowa-mobi
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    needs: image
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@d0d8abe699bfb85fec6de9f7adb5ae17292296ff # v6
        with:
          version: "0.12.20"
          python-version: "3.11"
      - name: Check deployment credentials
        env:
          DEPLOY_KEY: ${{ secrets.HOMELAB_DEPLOY_KEY }}
        run: test -n "$DEPLOY_KEY"
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: example/deployment-config
          ref: main
          path: homelab
          ssh-key: ${{ secrets.HOMELAB_DEPLOY_KEY }}
      - name: Commit the image digest to homelab
        id: promote
        env:
          GH_TOKEN: ${{ github.token }}
          REVISION: ${{ github.sha }}
          DIGEST: ${{ needs.image.outputs.digest }}
        run: |
          set -euo pipefail
          git -C homelab config user.name 'sowa-mobi deploy'
          git -C homelab config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          for attempt in $(seq 1 5); do
            head=$(gh api repos/wjarka/sowa-mobi/git/ref/heads/master --jq '.object.sha')
            if [ "$head" != "$REVISION" ]; then
              echo 'Superseded by a newer master commit; skipping promotion.'
              echo 'deployed=false' >> "$GITHUB_OUTPUT"
              exit 0
            fi
            git -C homelab fetch origin main
            git -C homelab reset --hard origin/main
            uv run --no-project python scripts/update_homelab.py homelab "$DIGEST" "$REVISION"
            git -C homelab add stacks/sowa-mobi/compose.yaml
            if git -C homelab diff --cached --quiet; then
              echo 'Desired image is already recorded; verifying the running revision.'
              echo 'deployed=true' >> "$GITHUB_OUTPUT"
              exit 0
            fi
            git -C homelab commit -m "deploy: sowa-mobi ${REVISION:0:12}"
            if git -C homelab push origin HEAD:main; then
              echo 'deployed=true' >> "$GITHUB_OUTPUT"
              exit 0
            fi
            sleep 5
          done
          echo 'Could not update homelab after five attempts' >&2
          exit 1
      - name: Verify the deployed revision is healthy
        if: steps.promote.outputs.deployed == 'true'
        env:
          REVISION: ${{ github.sha }}
          DIGEST: ${{ needs.image.outputs.digest }}
        run: uv run --no-project python scripts/verify_deployment.py homelab "$REVISION" "$DIGEST"
