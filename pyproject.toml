[project]
name = "sowa-mobi"
version = "0.1.0"
description = "Klient API dla systemu bibliotecznego SOWA (Sokrates-software)"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "requests>=2.32",
    "beautifulsoup4>=4.12",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "httpx>=0.27",
]

[project.scripts]
sowa-mobi = "sowa_mobi.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/sowa_mobi"]
